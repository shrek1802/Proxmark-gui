name: TagForge stable release
on:
  push:
    tags:
      - 'tagforge-v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate released GUI and updater
        run: |
          python3 -m py_compile package/usr/share/proxmark3-workshop/payload/proxmark_gui.py package/usr/share/proxmark3-workshop/payload/tagforge_app_updater.py
          bash -n package/usr/share/proxmark3-workshop/payload/setup-installer.sh
      - name: Package stable GUI asset
        run: |
          mkdir -p dist
          cp package/usr/share/proxmark3-workshop/payload/proxmark_gui.py dist/tagforge-gui.py
          sha256sum dist/tagforge-gui.py > dist/SHA256SUMS
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/tagforge-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/tagforge-gui.py dist/SHA256SUMS --title "TagForge Studio ${GITHUB_REF_NAME}" --generate-notes --verify-tag
