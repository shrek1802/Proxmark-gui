name: TagForge Python checks
on:
  push:
    branches:
      - feature/tagforge-studio-ui
  pull_request:
  workflow_dispatch:
jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile GUI without launching it
        run: python3 -m py_compile package/usr/share/proxmark3-workshop/payload/proxmark_gui.py package/usr/share/proxmark3-workshop/payload/tagforge_setup.py
      - name: Check dashboard wiring and compatibility paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("package/usr/share/proxmark3-workshop/payload/proxmark_gui.py")
          s=p.read_text()
          for token in ("APP='TagForge Studio'", "class PM3:", "class App(tk.Tk):", "HeroTitle.TLabel", "SCAN HF", "SCAN LF", "self.show_saved_page", "self.show_rf_lab", "~/.config/proxmark3-workshop", "~/.local/share/proxmark3-workshop"):
              assert token in s, f"Missing {token}"
          print("Static dashboard and compatibility checks passed")
          PY
      - name: Check installer scripts
        run: |
          bash -n package/usr/share/proxmark3-workshop/payload/setup-installer.sh
          bash -n package/usr/share/proxmark3-workshop/payload/update-gui-only.sh
          bash -n package/usr/bin/proxmark3-workshop-setup
      - name: Build Debian preview package
        run: |
          mkdir -p dist
          mkdir -p staging/DEBIAN staging/usr
          cp -a DEBIAN/. staging/DEBIAN/
          cp -a package/usr/. staging/usr/
          chmod 755 staging/DEBIAN/postinst staging/usr/bin/proxmark3-workshop-setup
          chmod 755 staging/usr/share/proxmark3-workshop/payload/*.sh
          dpkg-deb --build staging dist/tagforge-studio-setup_0.72.0-preview4_all.deb
          dpkg-deb --info dist/tagforge-studio-setup_0.72.0-preview4_all.deb
          dpkg-deb --contents dist/tagforge-studio-setup_0.72.0-preview4_all.deb
      - name: Verify package layout and launcher
        run: |
          set -eu
          dpkg-deb --contents dist/tagforge-studio-setup_0.72.0-preview4_all.deb > dist/contents.txt
          grep -q './usr/bin/proxmark3-workshop-setup' dist/contents.txt
          grep -q './usr/share/proxmark3-workshop/payload/tagforge_setup.py' dist/contents.txt
          grep -q './usr/share/applications/proxmark3-workshop-setup.desktop' dist/contents.txt
          grep -q './usr/share/proxmark3-workshop/payload/setup-installer.sh' dist/contents.txt
          if grep -E '/\.git/|/\.github/|/source-archives/' dist/contents.txt; then
            echo 'ERROR: Development files were included in the installer'
            exit 1
          fi
          test "$(dpkg-deb -f dist/tagforge-studio-setup_0.72.0-preview4_all.deb Package)" = "proxmark3-workshop-setup"
          echo 'Debian package layout verified'
      - name: Upload preview installer
        uses: actions/upload-artifact@v4
        with:
          name: tagforge-studio-ubuntu-preview
          path: dist/*.deb
